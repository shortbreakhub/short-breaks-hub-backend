name: Docker secret exclusion

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker build context with synthetic secrets
        run: python3 scripts/check-docker-secret-exclusion.py
      - name: Build local image without runtime credentials
        run: docker build -t shortbreakhub-api:secret-exclusion-check .
      - name: Check all final image layers and application resources
        run: python3 scripts/check-docker-secret-exclusion.py --image shortbreakhub-api:secret-exclusion-check
      - name: Check secure configuration bootstrap and isolated runtime
        run: |
          docker pull postgres:16
          python3 scripts/check-ecs-config-bootstrap.py --image shortbreakhub-api:secret-exclusion-check --runtime
